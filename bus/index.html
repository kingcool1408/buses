<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Tracker - Home</title>
    <link rel="stylesheet" href="ha.css">
</head>
<body>
    <nav> 
        <ul class="nav-links">
            <li><a href="index.html" class="active">Home</a></li>
            <li><a href="map.html">The Map</a></li>
            <li><a href="#" onclick="document.getElementById('id01').style.display='block'">Login</a></li>
        </ul>
    </nav>

    <div class="hero-container">
        <p id="typeanimtext"><span id="typing-text"></span><span class="cursor">|</span></p>
    </div>
    
    <div class="login-container">
        <h2>Welcome Back</h2>
        <button onclick="document.getElementById('id01').style.display='block'" style="width:auto;">Login to Account</button>
    </div>

    <div id="id01" class="modal">
      <form class="modal-content animate" action="map.html" method="get">
        <div class="imgcontainer">
          <span onclick="document.getElementById('id01').style.display='none'" class="close" title="Close Modal">&times;</span>
          <img src="images.png" alt="Avatar" class="avatar">
        </div>

        <div class="container">
          <label for="uname"><b>Username</b></label>
          <input type="text" placeholder="Enter Username" name="uname" required>

          <label for="psw"><b>Password</b></label>
          <input type="password" placeholder="Enter Password" name="psw" required>
            
          <button type="submit">Login</button>
          <label>
            <input type="checkbox" checked="checked" name="remember"> Remember me
          </label>
        </div>

        <div class="container footer-container">
          <button type="button" onclick="document.getElementById('id01').style.display='none'" class="cancelbtn">Cancel</button>
          <span class="psw">Forgot <a href="#">password?</a></span>
        </div>
      </form>
    </div>

    <script src="sigma.js"></script>
    <script>
    var modal = document.getElementById('id01');
    window.onclick = function(event) {
        if (event.target == modal) {
            modal.style.display = "none";
        }
    }
    </script>
</body>
</html>
